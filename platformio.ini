; 415 SIGNAL - ESP32-C3 0.42" OLED demo
; The stock "espressif32" platform still ships Arduino core 2.x; this demo needs
; core 3.x (new I2S PDM driver), provided by the community pioarduino platform.
[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -Os
